# Canonical data-type for an env entry's body —
# `system:/data-type/env`. The Body shape every `<provider>:/env/<name>`
# Contribution carries. Mirrors `EnvBody` in
# internal/extensions/manifest/api/config_resources.go. The entry ID is
# the environment variable name (e.g. `ANTHROPIC_API_KEY`).
$schema: ktw-schema/v1
name: env
version: "1.0.0"
root: Env
description: |
  Declares one environment variable the binary reads. Surfaced by
  `config check` so the user knows which secrets / settings to export.
types:
  Env:
    type: object
    fields:
      label:
        type: string
        description: human-readable display label for the variable
        optional: true
      required:
        type: boolean
        description: whether the binary cannot function without this variable
        optional: true
      description:
        type: string
        description: one-line purpose of the variable
        optional: true
