# Registers `config-file` as a system contribution kind. Every binary
# emits one `<provider>:/config-file/<name>` Contribution per config file
# it reads (via WithConfigFiles + embedded templates). The URI of this
# entry is `system:/contribution-type/config-file`; its body schema is
# `system:/data-type/config-file`.
name: config-file
description: |
  A config file the binary reads at runtime (e.g. Settings.yaml). Body
  records whether a first-run default template ships and a short purpose.

# The body schema of every contribution of this kind. Declared, never
# derived: a kind whose schema is inferred from its name cannot be validated
# when the inference fails, and the failure is silent.
schema: system:/data-type/config-file
validate: error

# Layers every entry of this kind carries, and the metadata budget — read by
# the framework (default layer, residency, budget check); measured from the
# census on 2026-09-21, not guessed. See contribution-types.md §2.
layers:
  data: {mediaType: application/json, required: true, default: true}
meta:
  budget: 128  # measured max 35 B across 21 binaries (2026-09-21), x1.5 rounded up
  # Each entry's description is written once, in its data layer; the
  # manifest builder derives it into meta, so a listing reads it from
  # the index.
  from: data
  fields: [description]
