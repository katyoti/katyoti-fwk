# Registers `env` as a system contribution kind. Binaries emit one
# `<provider>:/env/<name>` Contribution per environment variable they
# read. The URI of this entry is `system:/contribution-type/env`; its
# body schema is `system:/data-type/env`.
name: env
description: |
  An environment variable the binary reads (e.g. ANTHROPIC_API_KEY).
  Surfaced by `config check` so the user knows which secrets / settings
  to export.

# The body schema of every contribution of this kind. Declared, never
# derived: a kind whose schema is inferred from its name cannot be validated
# when the inference fails, and the failure is silent.
schema: system:/data-type/env
validate: error

# Layers every entry of this kind carries, and the metadata budget — read by
# the framework (default layer, residency, budget check); measured from the
# census on 2026-09-21, not guessed. See contribution-types.md §2.
layers:
  data: {mediaType: application/json, required: true, default: true}
meta:
  budget: 256  # measured max 139 B across the shipped binaries (2026-11-16, description derived into meta), x1.5 rounded up
  # Each entry's description is written once, in its data layer; the
  # manifest builder derives it into meta, so a listing reads it from
  # the index.
  from: data
  fields: [description]
