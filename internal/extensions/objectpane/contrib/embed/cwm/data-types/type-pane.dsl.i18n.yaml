        tabs:
          description: 'Les onglets principaux de tout objet de ce type, dans l''ordre (le nom d''un panneau ou un identifiant d''onglet complet) ; les autres onglets passent derrière Plus'
        variants:
          description: 'Les onglets principaux selon une condition : la première variante dont le when est vrai sur l''objet les donne ; sinon tabs'
        view:
          description: 'Comment un objet de ce type s''affiche dans son onglet Information ; vide = un formulaire de ses champs'
