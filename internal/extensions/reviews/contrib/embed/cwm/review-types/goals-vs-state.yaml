# A generic review type of the reviews pack: performed by an agent following
# the review-dimension skill with its guide (a reference of ktw-agents).
name: goals-vs-state
title: Goals versus state
description: >-
  Does what the module built and is building serve what it wants: each goal's features and passing criteria, the drift, what serves nothing.
dimension: method
applies:
  capabilities: [reviewable]
trigger:
  mode: manual
runner:
  skill: ktw-agents:/skill/review-dimension
  input:
    guide: ktw-agents:/reference/review/goals-vs-state.md
rating: The guide's rating rule (its Rate section).
presets: [full]
max_cost_usd: 3
