# A generic review type of the reviews pack: performed by an agent following
# the review-dimension skill with its guide (a reference of ktw-agents).
name: where-are-we
title: Where are we
description: >-
  The module's state of play for a manager: where it stands on each review dimension, what moved, the five things to do first — the synthesis of its current reviews.
dimension: synthesis
applies:
  capabilities: [reviewable]
trigger:
  mode: manual
runner:
  skill: ktw-agents:/skill/review-dimension
  input:
    guide: ktw-agents:/reference/review/where-are-we.md
rating: The guide's rating rule (its Rate section).
presets: []   # run on its own, after the reviews it reads
max_cost_usd: 2
