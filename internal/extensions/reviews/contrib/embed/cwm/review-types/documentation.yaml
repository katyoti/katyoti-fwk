# A generic review type of the reviews pack: performed by an agent following
# the review-dimension skill with its guide (a reference of ktw-agents).
name: documentation
title: Documentation
description: >-
  Does the module's documentation say what is true, to the people who read it, completely and in one place: its pages, its features' descriptions, its API comments.
dimension: documentation
applies:
  capabilities: [reviewable]
trigger:
  mode: manual
runner:
  skill: ktw-agents:/skill/review-dimension
  input:
    guide: ktw-agents:/reference/review/documentation.md
rating: The guide's rating rule (its Rate section).
presets: [full]
max_cost_usd: 3
