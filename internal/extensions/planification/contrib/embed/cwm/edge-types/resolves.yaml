name: resolves
from: request
to: any
cardinality: N:1
from_capabilities: [request]
to_capabilities: []
target: object
object_storage: edges
description: |
  A request MEETS a requirement of a gate on the object it points at — filed by
  the planner when the gate refused a move of that object (its
  `gate_requirement` names which). When the request ends, the planner tries the
  move again. A request filed on the object itself carries no edge: the object
  is its own.
inverse_name: resolved-by
