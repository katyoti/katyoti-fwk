name: superseded-by
from: request
to: request
cardinality: N:1
from_capabilities: [request]
to_capabilities: [request]
target: object
object_storage: edges
description: |
  A request is SUPERSEDED BY the open request that carries its work from now
  on: replaced by it (supersede) or merged into it (merge, its content carried
  over). It ends dropped; what depended on it depends on its successor; its
  requester is told.
inverse_name: supersedes
