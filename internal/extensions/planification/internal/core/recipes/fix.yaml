# Fix: close a gap or a defect — implemented, its module brought up to date
# (the module-updated gate), then verified - by the reviewer, a person where
# asked.
name: fix
description: Implement the fix, bring the module up to date, verify it closes the gap.
kind: fix
transition: done
steps:
  - {name: implement, phase: build, class: deliver, role: coder, share: 0.55, instructions: "Fix the gap the request names, with a test that fails before and passes after."}
  - {name: auto-review, phase: verify, class: deliver, role: auto-review, after: [implement], share: 0.05, instructions: "Run the automatic reviews that apply to the change (reviews start --trigger automatic with the request's kind and the paths its commits changed) and report each rating and its new findings; a new critical finding blocks the request."}
  - {name: module-update, phase: build, class: deliver, role: coder, after: [auto-review], share: 0.1, gate: module-updated, skill: ktw-agents:/skill/module-update, instructions: "Bring the module up to date with the change: the feature it serves and its use cases, the acceptance check that proves it (kept for non-regression), the module pages updated in place, the change-log entry naming the request — then record it (requests module-update)."}
  - {name: verify, phase: verify, class: deliver, role: reviewer, person_when_asked: true, interaction: validate, after: [implement, auto-review, module-update], share: 0.3, skill: ktw-methods:/skill/verify-and-gate, instructions: "Check the fix closes the gap and breaks nothing near it: run its checks again (requests check), run the code review on its commits. Report your verdict: approved, or rejected saying what to change - the fix is then done again with it. A person verifies instead where the request, its release or its stream asks it (review: person)."}
