# Build, quick: a small change needs no analysis step — implement it, have a
# reviewer judge the result - a person where asked.
name: build-quick
description: Implement a small change, have a reviewer judge the result - a person where the request, its release or its stream asks it.
kind: build
depth: quick
transition: done
steps:
  - {name: implement, phase: build, class: deliver, role: coder, share: 0.75, instructions: "Make the small change asked, with its test. Then bring the module up to date, following the skill module-update (ktw-agents:/skill/module-update): the feature it serves and its use cases, the acceptance check that proves the change, the module pages in place, the change-log entry naming the request — recorded with requests module-update."}
  - {name: auto-review, phase: verify, class: deliver, role: auto-review, after: [implement], share: 0.05, instructions: "Run the automatic reviews that apply to the change (reviews start --trigger automatic with the request's kind and the paths its commits changed) and report each rating and its new findings; a new critical finding blocks the request."}
  - {name: review, phase: verify, class: deliver, role: reviewer, person_when_asked: true, interaction: validate, verifies: true, after: [implement, auto-review], share: 0.2, instructions: "Review the work against the request, as its reviewer: run its checks again (requests check), run the code review on its commits, judge each deliverable against what was asked. Report your verdict: approved, or rejected saying what to change - the work before you is then done again with it. A person reviews instead where the request, its release or its stream asks it (review: person)."}
