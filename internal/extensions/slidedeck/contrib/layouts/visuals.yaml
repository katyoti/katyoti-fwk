name: visuals
description: A heading and a short text beside pictures, each with its caption — sites, products, screens (one to six; the grid adapts to the count).
slots:
  - name: default
    description: A level-2 heading, then a short text.
    required: true
  - name: visuals
    description: A list, one item per picture — an image as ![alt](path), then its caption.
    required: true
    minItems: 1
    maxItems: 6
example: |
