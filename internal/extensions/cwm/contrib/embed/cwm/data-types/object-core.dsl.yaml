$schema: ktw-schema/v1
name: object-core
version: "1.0.0"
root: ObjectCore
description: |
  The editable part of the object core — the fields every object has, whatever
  its type and capabilities (concepts.md §3). The object pane's header shows
  and edits it, never a capability group. The parent is moved by ObjectMove;
  badges are set by capabilities; the body is what its type says it is, edited
  with the type's own fields.
types:
  ObjectCore:
    type: object
    fields:
      name:
        type: string
        label: Name
        description: What the object is called.
        optional: true
      description:
        type: string
        label: Description
        description: What the object is about, in a sentence or two.
        optional: true
      icon:
        type: string
        label: Icon
        description: An icon name; the type's when empty.
        optional: true
      tags:
        type: string[]
        label: Tags
        description: Free-form labels for filtering.
        optional: true
