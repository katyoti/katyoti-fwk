# The `viewpoint` kind, declared by the drawio pack (drawiokind.Leaves): any pack
# holding its folder is read as this kind. Its schema is provider-relative: the
# publisher names `<provider>:/data-type/viewpoint`, the shape of the drawio body type.
name: viewpoint
description: |
  A type of drawing: a notation, the kinds this picture shows, a template
  library with its page template, and a layout profile. A LogicalDiagram names
  one in its `viewpoint` field.

# Declared, not derived: a kind whose schema is inferred from its name is
# unvalidatable the moment the inference fails, and fails silently.
schema: viewpoint
validate: error

# Every entry carries its decoded body (data) and the YAML as written
# (source, the default layer).
layers:
  data: {mediaType: application/json, required: true}
  source: {mediaType: application/yaml, required: true, default: true}
meta:
  budget: 384  # measured max 243 B across the shipped binaries (2026-11-16, description derived into meta), x1.5 rounded up
  # Each entry's description is written once, in its data layer; the
  # manifest builder derives it into meta, so a listing reads it from
  # the index.
  from: data
  fields: [description]

# How a file becomes an entry (contribution-types.md "How files become
# layers"): a YAML file in `viewpoints/`, its tree the data layer, the file as written
# the source.
source:
  folder: viewpoints
  match: ["*.yaml", "*.yml"]
  format: structured
  layers:
    data: {from: tree}
    source: {from: file}
