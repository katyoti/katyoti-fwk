name: verdict
label: Verdict
icon: gavel
description: >-
  The record of a RUN against one checkable criterion: what the probe returned,
  when, and on what. Carried by `verdict` objects and by nothing else.

  It is deliberately NOT a field on `checkable`. A criterion declares what would
  have to be true; a verdict says what happened when that was checked. Keeping
  them in one file would let an authored claim and a measured fact be edited as
  if they were the same kind of thing — and only a run may write a verdict.
schema: ktw-methods:/data-type/cap-verdict
