# Every feature of a module — wherever it sits under it, a sub-feature under
# its feature included. Its source is the features service's board: the
# features by state, highest cost of delay first, each with its state, the
# object it sits under, its cost of delay and the goals it serves, a click
# opening it, Add creating one under the module. It stands for the module's
# feature children tab (`replaces_children`): the features show once.
name: "Features"
description: "Every feature of this module: its state, its cost of delay and the goals it serves"
icon:
  tabler: "package"
  emoji: "📦"
order: 31
filter:
  capabilities: ["module"]
  # Only a planned module shows it: a study or a dossier, not planned, does
  # not; the project, code modules and
  # system modules are not of type module and keep it.
  when: "'module' not in current.capabilities or 'planned' in current.capabilities"
replaces_children: ["feature"]
source: "ktw-methods:features/board"
refresh:
  scope: "module"
  types: ["feature", "goal"]
