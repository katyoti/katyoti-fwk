$schema: ktw-schema/v1
name: acceptance-criterion
version: "1.0.0"
root: AcceptanceCriterion
description: |
  The acceptance-criterion type's own fields. Its id (UC-NNN-ACn) and claim are
  the object core (id, name); its probe, note and severity the `checkable`
  capability's; whether it passed a `verdict` object's.
types:
  AcceptanceCriterion:
    type: object
    fields:
      layer:
        type: string@enum(L1, L2, L3)
        label: Layer
        description: Test layer chosen at authoring time.
        optional: true
      test_ref:
        type: string
        label: Test ref
        description: The test that proves the claim — a test name or check reference.
        optional: true
      kind:
        type: string@enum(normal, anti)
        label: Kind
        description: anti = a must-NOT-happen criterion.
        optional: true
