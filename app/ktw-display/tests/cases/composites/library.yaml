id: composites/library
category: composites
title: Composite — Library (gui-table)
description: Array<Book> schema with 25 rows. ui-table extension declares column overrides + opts into the ui-filter extension (search on title + author_email). Sortable columns; client-side pagination at 10 rows/page. Row click → action postMessage.
schema:
  name: library-test
  version: 1
  root: BookList
  types:
    BookList:
      type: array
      label: Library
      items: Book
      extensions:
        - type: ui-table
          name: default
          columns:
            - id: id
              label: ID
              width: 110
            - id: title
              label: Title
            - id: author_email
              label: Author
            - id: rating
              label: Rating
              align: center
              width: 80
            - id: progress_pct
              label: Progress
              align: right
              width: 100
            - id: is_finished
              label: Finished
              align: center
              width: 100
          filters: true
          pagination: true
          pageSize: 10
          striped: true
          highlightOnHover: true
        - type: ui-filter
          filters:
            - title
            - author_email
    Book:
      type: object
      label: Book
      idField:
        - id
      titleField:
        - title
      fields:
        id:
          type: string
          label: ID
        title:
          type: string
          label: Title
        author_email:
          type: string
          label: Author email
          content:
            type: email
        notes:
          type: string
          label: Notes
          content:
            type: markdown
          optional: true
        rating:
          type: number
          label: Rating
          content:
            type: rating
            max: 5
          default: 3
        progress_pct:
          type: number
          label: Progress (%)
          content:
            type: slider
            min: 0
            max: 100
          default: 0
        is_finished:
          type: boolean
          label: Finished?
          default: false
