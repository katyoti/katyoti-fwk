# LLM Provider Model Configuration (April 2026)
# cost_input / cost_output = $/MTok. context_window / max_output in tokens.

default_model: claude-sonnet

models:
  # ── Anthropic (Claude 4.6) ──────────────────────────────────────────
  claude-opus:
    type: anthropic
    provider: anthropic
    model_id: claude-opus-4-6
    max_tokens: 16384
    context_window: 1000000
    max_output: 128000
    cost_input: 5.00
    cost_output: 25.00
    thinking:
      enabled: true
      budget_tokens: 10000
    auto_cache: true

  claude-sonnet:
    type: anthropic
    provider: anthropic
    model_id: claude-sonnet-4-6
    max_tokens: 16384
    context_window: 1000000
    max_output: 64000
    cost_input: 3.00
    cost_output: 15.00
    auto_cache: true

  claude-haiku:
    type: anthropic
    provider: anthropic
    model_id: claude-haiku-4-5-20251001
    max_tokens: 8192
    context_window: 200000
    max_output: 64000
    cost_input: 1.00
    cost_output: 5.00
    auto_cache: true

  # ── OpenAI (GPT-5.4) ───────────────────────────────────────────────
  gpt-5.4:
    type: openai
    provider: openai
    model_id: gpt-5.4
    max_tokens: 16384
