# A notation: element and relationship kinds, and the rules a model must follow.
# Looks live in a drawio-template library; which kinds one picture shows, in a viewpoint.
id: archimate3
displayName: ArchiMate 3
version: '3.2'
description: 'ArchiMate 3.2 enterprise architecture: the strategy, business, application, technology, physical,
  motivation and implementation and migration elements, the eleven relationships, and which relationship may join
  which kinds. The rules follow the metamodel at the level of element groups (active structure, behavior, passive
  structure per layer); they refuse what the metamodel never allows, not every combination the relationship tables
  of the standard exclude.'
elements:
  Resource: {label: Resource, description: An asset owned or controlled by an individual or organization., category: strategy}
  Capability: {label: Capability, description: An ability that an active structure element possesses., category: strategy}
  ValueStream: {label: Value Stream, description: 'A sequence of activities that create an overall result for a
      customer, stakeholder, or end user.', category: strategy}
  CourseOfAction: {label: Course of Action, description: An approach or plan for configuring capabilities and resources
      to achieve a goal., category: strategy}
  BusinessActor: {label: Business Actor, description: A business entity capable of performing behavior., category: business}
  BusinessRole: {label: Business Role, description: 'The responsibility for performing specific behavior, to which
      an actor can be assigned.', category: business}
  BusinessCollaboration: {label: Business Collaboration, description: An aggregate of internal active structure
      elements that work together to perform collective behavior., category: business}
  BusinessInterface: {label: Business Interface, description: A point of access where a business service is made
      available to the environment., category: business}
  BusinessProcess: {label: Business Process, description: A sequence of business behaviors that achieves a specific
      result., category: business}
  BusinessFunction: {label: Business Function, description: A collection of business behavior based on chosen criteria
      such as required resources or competencies., category: business}
  BusinessInteraction: {label: Business Interaction, description: 'A unit of collective business behavior performed
      by two or more actors, roles or collaborations.', category: business}
  BusinessEvent: {label: Business Event, description: A business state change., category: business}
  BusinessService: {label: Business Service, description: An explicitly defined exposed business behavior., category: business}
  BusinessObject: {label: Business Object, description: A concept used within a particular business domain., category: business}
  Contract: {label: Contract, description: A formal or informal specification of an agreement between a provider
      and a consumer., category: business}
  Representation: {label: Representation, description: A perceptible form of the information carried by a business
      object., category: business}
  Product: {label: Product, description: 'A coherent collection of services and/or passive structure elements, with
      a contract, offered as a whole.', category: business}
  ApplicationComponent: {label: Application Component, description: An encapsulation of application functionality
      aligned to implementation structure., category: application}
  ApplicationCollaboration: {label: Application Collaboration, description: An aggregate of application internal
      active structure elements that work together., category: application}
  ApplicationInterface: {label: Application Interface, description: A point of access where application services
      are made available., category: application}
  ApplicationFunction: {label: Application Function, description: Automated behavior that can be performed by an
      application component., category: application}
  ApplicationInteraction: {label: Application Interaction, description: A unit of collective application behavior
      performed by two or more application components., category: application}
  ApplicationProcess: {label: Application Process, description: A sequence of application behaviors that achieves
      a specific result., category: application}
  ApplicationEvent: {label: Application Event, description: An application state change., category: application}
  ApplicationService: {label: Application Service, description: An explicitly defined exposed application behavior.,
    category: application}
  DataObject: {label: Data Object, description: Data structured for automated processing., category: application}
  TechnologyNode: {label: Node, description: 'A computational or physical resource that hosts, manipulates, or interacts
      with other resources.', category: technology}
  Device: {label: Device, description: A physical IT resource upon which system software and artifacts may be stored
      or deployed., category: technology}
  SystemSoftware: {label: System Software, description: 'Software that provides or contributes to an environment
      for storing, executing, and using software or data.', category: technology}
  TechnologyCollaboration: {label: Technology Collaboration, description: An aggregate of nodes that work together
      to perform collective technology behavior., category: technology}
  TechnologyInterface: {label: Technology Interface, description: A point of access where technology services offered
      by a node can be accessed., category: technology}
  Path: {label: Path, description: 'A link between two or more nodes, through which they can exchange data, energy,
      or material.', category: technology}
  CommunicationNetwork: {label: Communication Network, description: 'A set of structures that connects nodes for
      transmission, routing, and reception of data.', category: technology}
  TechnologyFunction: {label: Technology Function, description: A collection of technology behavior that can be
      performed by a node., category: technology}
  TechnologyProcess: {label: Technology Process, description: A sequence of technology behaviors that achieves a
      specific result., category: technology}
  TechnologyInteraction: {label: Technology Interaction, description: A unit of collective technology behavior performed
      by two or more nodes., category: technology}
  TechnologyEvent: {label: Technology Event, description: A technology state change., category: technology}
  TechnologyService: {label: Technology Service, description: An explicitly defined exposed technology behavior.,
    category: technology}
  Artifact: {label: Artifact, description: 'A piece of data that is used or produced in a software development process,
      or by deployment and operation of an IT system.', category: technology}
  Equipment: {label: Equipment, description: 'One or more physical machines, tools, or instruments that can create,
      use, store, move, or transform materials.', category: physical}
  Facility: {label: Facility, description: A physical structure or environment., category: physical}
  DistributionNetwork: {label: Distribution Network, description: A physical network used to transport materials
      or energy., category: physical}
  Material: {label: Material, description: Tangible physical matter or energy., category: physical}
  Stakeholder: {label: Stakeholder, description: 'An individual, team, or organization that represents an interest
      in the outcome of the architecture.', category: motivation}
  Driver: {label: Driver, description: An external or internal condition that motivates an organization to define
      its goals., category: motivation}
  Assessment: {label: Assessment, description: The result of an analysis of the state of affairs with respect to
      some driver., category: motivation}
  Goal: {label: Goal, description: 'A high-level statement of intent, direction, or desired end state.', category: motivation}
  Outcome: {label: Outcome, description: 'An end result, effect, or consequence of a certain state of affairs.',
    category: motivation}
  Principle: {label: Principle, description: A statement of intent defining a general property that applies to any
      system in a certain context., category: motivation}
  Requirement: {label: Requirement, description: A statement of need defining a property that applies to a specific
      system., category: motivation}
  Constraint: {label: Constraint, description: 'A limitation on aspects of the architecture, its implementation
      process, or its realization.', category: motivation}
  Meaning: {label: Meaning, description: 'The knowledge or expertise present in, or the interpretation given to,
      a concept in a particular context.', category: motivation}
  Value: {label: Value, description: 'The relative worth, utility, or importance of a concept.', category: motivation}
  WorkPackage: {label: Work Package, description: A series of actions identified and designed to achieve specific
      results within specified time and resource constraints., category: implementation}
  Deliverable: {label: Deliverable, description: A precisely-defined result of a work package., category: implementation}
  ImplementationEvent: {label: Implementation Event, description: A state change related to implementation or migration.,
    category: implementation}
  Plateau: {label: Plateau, description: A relatively stable state of the architecture that exists during a limited
      period of time., category: implementation}
  Gap: {label: Gap, description: A statement of difference between two plateaus., category: implementation}
  Grouping: {label: Grouping, description: Aggregates or composes concepts that belong together based on some common
      characteristic., category: composite}
  Location: {label: Location, description: A conceptual or physical place or position where concepts are located
      or performed., category: composite}
  Junction: {label: Junction, description: Joins or splits relationships of the same type (and / or)., category: composite}
relationships:
  composition: {label: Composition, description: An element consists of one or more other concepts.}
  aggregation: {label: Aggregation, description: An element combines one or more other concepts.}
  assignment: {label: Assignment, description: 'Allocation of responsibility, performance of behavior, storage,
      or execution.'}
  realization: {label: Realization, description: 'An entity plays a critical role in the creation, achievement,
      sustenance, or operation of a more abstract entity.'}
  serving: {label: Serving, description: An element provides its functionality to another element.}
  access: {label: Access, description: The ability of behavior and active structure elements to observe or act upon
      passive structure elements.}
  influence: {label: Influence, description: An element affects the implementation or achievement of some motivation
      element.}
  triggering: {label: Triggering, description: A temporal or causal relationship between elements.}
  flow: {label: Flow, description: Transfer from one element to another.}
  specialization: {label: Specialization, description: An element is a particular kind of another element.}
  association: {label: Association, description: 'An unspecified relationship, or one not represented by another
      ArchiMate relationship.'}
