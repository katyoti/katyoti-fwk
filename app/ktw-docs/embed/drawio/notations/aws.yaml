# A notation: element and relationship kinds, and the rules a model must follow.
# Looks live in a drawio-template library; which kinds one picture shows, in a viewpoint.
id: aws
displayName: AWS architecture
version: '2023'
description: 'Cloud architectures on AWS: the most-used services by category, users and clients, and the groups
  a zone can be (kind AWSCloud, Region, AvailabilityZone, VPC, PublicSubnet, PrivateSubnet, SecurityGroup, AutoScalingGroup).
  The icons are draw.io''s AWS 4 shapes.'
