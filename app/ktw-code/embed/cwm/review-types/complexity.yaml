# A code review type of ktw-code: performed by an agent following the
# code-review skill in its run mode, with its guide.
name: complexity
title: Complexity
description: >-
  Over-complicated and under-complicated code: what could be simpler, what is too naive.
dimension: quality
applies:
  capabilities: [code]
  when: "len(object.code.code_packages) > 0"
trigger:
  mode: manual
runner:
  skill: ktw-code:/skill/code-review
  input:
    review: complexity
    guide: ktw-code:/reference/review/complexity.md
rating: >-
  critical when a finding is critical, needs-attention when one is high or
  medium, good otherwise.
presets: [code-deep]
max_cost_usd: 3
