# A code review type of ktw-code: performed by an agent following the
# code-review skill in its run mode, with its guide.
name: security
title: Security
description: >-
  Injection, authentication, secrets, the OWASP top ten and vulnerable dependencies in the module's code.
dimension: security
applies:
  capabilities: [code]
  when: "len(object.code.code_packages) > 0"
trigger:
  mode: manual
runner:
  skill: ktw-code:/skill/code-review
  input:
    review: security
    guide: ktw-code:/reference/review/security.md
rating: >-
  critical when a finding is critical, needs-attention when one is high or
  medium, good otherwise.
presets: [code, full]
max_cost_usd: 4
