# A code review type of ktw-code: performed by an agent following the
# code-review skill in its run mode, with its guide.
name: quality
title: Quality and consistency
description: >-
  Readability, naming, vocabulary, structural and style consistency, code documentation.
dimension: quality
applies:
  capabilities: [code]
  when: "len(object.code.code_packages) > 0"
trigger:
  mode: manual
runner:
  skill: ktw-code:/skill/code-review
  input:
    review: quality
    guide: ktw-code:/reference/review/quality.md
rating: >-
  critical when a finding is critical, needs-attention when one is high or
  medium, good otherwise.
presets: [code, full]
max_cost_usd: 3
