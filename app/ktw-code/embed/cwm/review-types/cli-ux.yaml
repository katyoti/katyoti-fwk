# A code review type of ktw-code: performed by an agent following the
# code-review skill in its run mode, with its guide.
name: cli-ux
title: Command-line experience
description: >-
  The module's command line: its capabilities, the ideal command tree and the gaps.
dimension: usability
applies:
  capabilities: [code]
  when: "len(object.code.code_packages) > 0"
trigger:
  mode: manual
runner:
  skill: ktw-code:/skill/code-review
  input:
    review: cli-ux
    guide: ktw-code:/reference/review/cli-ux-review.md
rating: >-
  critical when a finding is critical, needs-attention when one is high or
  medium, good otherwise.
presets: [code-deep]
max_cost_usd: 3
