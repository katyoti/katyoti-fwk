# A code review type of ktw-code: performed by an agent following the
# code-review skill in its run mode, with its guide.
name: red-team-architecture
title: Red team of the architecture
description: >-
  An adversarial stress test of the module's architectural decisions: each claim, its strongest case and its counter-argument.
dimension: architecture
applies:
  capabilities: [code]
  when: "len(object.code.code_packages) > 0"
trigger:
  mode: manual
runner:
  skill: ktw-code:/skill/code-review
  input:
    review: red-team-architecture
    guide: ktw-code:/reference/review/red-team-architecture.md
rating: >-
  critical when a finding is critical, needs-attention when one is high or
  medium, good otherwise.
presets: [code-deep]
max_cost_usd: 5
