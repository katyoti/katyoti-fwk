# A code review type of ktw-code: performed by an agent following the
# code-review skill in its run mode, with its guide.
name: library-audit
title: Library audit
description: >-
  For a reusable package: API consistency, extensibility and completeness.
dimension: quality
applies:
  capabilities: [code]
  when: "len(object.code.code_packages) > 0"
trigger:
  mode: manual
runner:
  skill: ktw-code:/skill/code-review
  input:
    review: library-audit
    guide: ktw-code:/reference/review/library-audit.md
rating: >-
  critical when a finding is critical, needs-attention when one is high or
  medium, good otherwise.
presets: [code-deep]
max_cost_usd: 3
