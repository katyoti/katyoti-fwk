name: code-fast-doc-output
root: CodeFastDocOutput
types:
  CodeFastDocOutput:
    type: object
    fields:
      doc_path:
        type: string
        description: "Path to the generated Confluence Markdown file."
        optional: true
      html_path:
        type: string
        description: "Path to the rendered HTML used for diagram validation."
        optional: true
      diagram_count:
        type: number
        description: "Number of diagrams that rendered successfully."
        optional: true
