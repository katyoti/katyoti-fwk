# Universes, solutions and versions as KaTyoti delivers them.
name: 'Universes, solutions and sidecar versions'
description: 'How KaTyoti is delivered and kept up to date: what a marketplace offers, a solution as the starting set a universe is created from, which version of each sidecar a universe runs, and how a project''s data follows an update.'
