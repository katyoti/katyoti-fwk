# Translations of the recipe beside this file (modules/guide, OD-015).
# A control is named {control:<anchor>} as in the recipe, never by its label:
# the player says the label the GUI shows in the person's language
# (internal/test/guide/labels_test.go holds it).
fr:
  name: Enregistrer mon écran
  description: Enregistrez une vidéo de votre écran, avec la caméra si vous le souhaitez, et retrouvez le fichier.
  hashtags:
  - enregistrer
  - vidéo
  - enregistrement d'écran
  - caméra
  steps:
    start: Appuyez sur {control:ribbon.record} dans le ruban et choisissez l'écran, la fenêtre ou l'onglet à enregistrer.
    stop: Faites ce que vous voulez montrer. Appuyez sur {control:ribbon.record} une fois terminé.
    find: La vidéo est enregistrée sous ktw-recording-<numéro>.webm dans votre dossier Téléchargements.
