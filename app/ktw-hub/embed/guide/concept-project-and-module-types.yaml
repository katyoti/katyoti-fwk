# The kinds of projects and modules as KaTyoti delivers them.
name: 'Project and module types'
description: 'What kind of project or module you are looking at: its type says what it is, what it shows and what it is for - a software project, a dossier d''architecture; software, documentation, an étude de l''existant.'
