# Translations of the recipe beside this file (modules/guide, OD-015).
# A control is named {control:<anchor>} as in the recipe, never by its label:
# the player says the label the GUI shows in the person's language
# (internal/test/guide/labels_test.go holds it).
fr:
  name: Discuter d'un objet
  description: Ouvrez un chat dont l'agent connaît déjà l'objet sur lequel vous êtes.
  hashtags:
  - chat
  - discuter
  - agent
  - question
  steps:
    pick-object: Choisissez un objet dans l'arbre.
    chat-tab: Ouvrez son onglet {control:objtab.tab:agent-context}.
    chat-here: Appuyez sur {control:object.chat-here}. Le chat démarre avec l'objet comme contexte.
    ask: Posez votre question. L'agent peut lire l'objet et agir dessus dans la limite de ses permissions.
