# Translations of the recipe beside this file (modules/guide, OD-015).
# A control is named {control:<anchor>} as in the recipe, never by its label:
# the player says the label the GUI shows in the person's language
# (internal/test/guide/labels_test.go holds it).
fr:
  name: Lancer une action
  description: Lancez l'une des actions qu'un objet propose.
  hashtags:
  - action
  - lancer une action
  - barre d'actions
  steps:
    pick-object: Choisissez un objet dans l'arbre.
    actions-tab: Ouvrez son onglet {control:objtab.tab:actions}.
    pick-action: Choisissez une carte d'action. Son formulaire demande ce dont elle a besoin.
    run: Appuyez sur {control:action.run}. Le résultat s'affiche une fois l'action terminée.
