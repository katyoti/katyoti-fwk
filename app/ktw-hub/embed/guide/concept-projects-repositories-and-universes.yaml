# Projects, git and universes as KaTyoti delivers them.
name: 'Projects, repositories and universes'
description: 'How your work is organised: a git repository in your projects folder is one project, with its own identity, type and planning, belonging to no universe and no solution; a universe attaches several repositories as its members, serves all their projects at once and keeps your settings and keys apart from them.'
